<title>Buscador de certificados</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 25px 15px;
  color: #333;
}
.contenedor {
  max-width: 520px;
  margin: 35px auto;
  background: white;
  padding: 28px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0002;
}
h1 { text-align: center; color: #713f55; font-size: 25px; }
p { text-align: center; line-height: 1.5; }
input {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 16px;
}
button, .descargar {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 10px;
  border: 0;
  border-radius: 6px;
  background: #713f55;
  color: white;
  font-size: 16px;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
}
button:hover, .descargar:hover { background: #512b3d; }
.resultado {
  border: 1px solid #ddd;
  padding: 12px;
  margin-top: 10px;
  border-radius: 7px;
}
.resultado button { background: #777; }
#verificacion { display: none; margin-top: 20px; }
#mensaje { margin-top: 15px; font-weight: bold; text-align: center; }
</style>
</head>

</div>

const registros = participantes.trim().split("\n").map(linea => {
  const [nombre, dni, enlace] = linea.split("|");
  return { nombre, dni, enlace };
});

function normalizar(texto) {
  return texto.normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().trim().replace(/\s+/g, " ");
}

let seleccionado = null;

function buscar() {
  const consulta = normalizar(document.getElementById("busqueda").value);
  const resultados = document.getElementById("resultados");
  const verificacion = document.getElementById("verificacion");
  const mensaje = document.getElementById("mensaje");
  document.getElementById("descarga").innerHTML = "";
  verificacion.style.display = "none";
  mensaje.textContent = "";
  resultados.innerHTML = "";
  seleccionado = null;

  if (consulta.length < 3) {
    mensaje.textContent = "Escribí al menos 3 letras para buscar.";
    return;
  }

  const encontrados = registros.filter(p =>
    normalizar(p.nombre).includes(consulta)
  );

  if (encontrados.length === 0) {
    mensaje.textContent = "No encontramos ese nombre. Revisá cómo lo escribiste.";
    return;
  }

  encontrados.forEach(persona => {
    const bloque = document.createElement("div");
    bloque.className = "resultado";

    const nombre = document.createElement("strong");
    nombre.textContent = persona.nombre;

    const boton = document.createElement("button");
    boton.textContent = "Este es mi nombre";
    boton.onclick = () => seleccionar(persona);

    bloque.appendChild(nombre);
    bloque.appendChild(boton);
    resultados.appendChild(bloque);
  });
}

function seleccionar(persona) {
  seleccionado = persona;
  document.getElementById("nombreElegido").textContent = persona.nombre;
  document.getElementById("verificacion").style.display = "block";
  document.getElementById("dni").value = "";
  document.getElementById("mensaje").textContent = "";
  document.getElementById("descarga").innerHTML = "";
}

function verificar() {
  const dniIngresado = document.getElementById("dni").value.replace(/\D/g, "");
  const mensaje = document.getElementById("mensaje");
  const descarga = document.getElementById("descarga");

  descarga.innerHTML = "";

  if (!seleccionado) return;

  if (dniIngresado === seleccionado.dni) {
    mensaje.textContent = "¡Datos verificados correctamente!";
    mensaje.style.color = "green";

    const enlace = document.createElement("a");
    enlace.className = "descargar";
    enlace.href = seleccionado.enlace;
    enlace.target = "_blank";
    enlace.rel = "noopener";
    enlace.textContent = "ABRIR MI CERTIFICADO";

    descarga.appendChild(enlace);
  } else {
    mensaje.textContent = "El DNI ingresado no coincide. Revisá los datos.";
    mensaje.style.color = "red";
  }
}
